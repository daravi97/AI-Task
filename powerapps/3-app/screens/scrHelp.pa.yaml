- conRootHelp:
    Control: GroupContainer
    Variant: verticalAutoLayoutContainer
    Properties:
      LayoutMode: =LayoutMode.Auto
      LayoutDirection: =LayoutDirection.Vertical
      LayoutGap: =0
      LayoutAlignItems: =LayoutAlignItems.Stretch
      DropShadow: =DropShadow.None
      Fill: =clrBg
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
    Children:
      - conHeaderHelp:
          Control: GroupContainer
          Variant: horizontalAutoLayoutContainer
          Properties:
            LayoutMode: =LayoutMode.Auto
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =8
            LayoutAlignItems: =LayoutAlignItems.Center
            DropShadow: =DropShadow.None
            Fill: =clrBlack
            Height: =64
            PaddingLeft: =16
            PaddingRight: =16
          Children:
            - lblBrandHelp:
                Control: Label
                Properties:
                  Text: ="Merch Store"
                  Font: =Font.'Open Sans'
                  Size: =15
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Width: =130
                  Height: =40
            - lblBrandDotHelp:
                Control: Label
                Properties:
                  Text: ="●"
                  Font: =Font.'Open Sans'
                  Size: =12
                  Color: =clrGreen
                  FontWeight: =FontWeight.Normal
                  Width: =20
                  Height: =40
            - lblHeaderSpacerHelp:
                Control: Label
                Properties:
                  Text: =""
                  Font: =Font.'Open Sans'
                  Size: =11
                  Color: =clrText
                  FontWeight: =FontWeight.Normal
                  FillPortions: =1
                  Height: =40
                  Width: =10
            - btnBalanceHelp:
                Control: Button
                Properties:
                  Text: =Text(fxBalance) & " tokens"
                  OnSelect: =Navigate(scrWallet, ScreenTransition.None)
                  Font: =Font.'Open Sans'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Fill: =clrGreen
                  Color: =clrBlack
                  HoverFill: =ColorFade(clrGreen, -10%)
                  PressedFill: =ColorFade(clrGreen, -20%)
                  HoverColor: =clrBlack
                  BorderColor: =clrGreen
                  BorderThickness: =1
                  DisabledFill: =clrBg
                  DisabledColor: =clrMuted
                  DisabledBorderColor: =clrBorder
                  Height: =36
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  Width: =130
            - btnCartHelp:
                Control: Button
                Properties:
                  Text: ="Cart (" & Sum(colCart, Qty) & ")"
                  OnSelect: =Navigate(scrCart, ScreenTransition.None)
                  Font: =Font.'Open Sans'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Fill: =clrBlack
                  Color: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(clrBlack, -10%)
                  PressedFill: =ColorFade(clrBlack, -20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  BorderColor: =RGBA(255, 255, 255, 0.4)
                  BorderThickness: =1
                  DisabledFill: =clrBg
                  DisabledColor: =clrMuted
                  DisabledBorderColor: =clrBorder
                  Height: =36
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  Width: =100
      - conBodyHelp:
          Control: GroupContainer
          Variant: verticalAutoLayoutContainer
          Properties:
            LayoutMode: =LayoutMode.Auto
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutAlignItems: =LayoutAlignItems.Stretch
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            FillPortions: =1
            PaddingTop: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
          Children:
            - lblHelpTitle:
                Control: Label
                Properties:
                  Text: ="Help & FAQs"
                  Font: =Font.'Open Sans'
                  Size: =18
                  Color: =clrText
                  FontWeight: =FontWeight.Bold
                  Height: =36
            - txtFaqSearch:
                Control: TextInput
                Properties:
                  Default: =""
                  HintText: ="Search questions"
                  Font: =Font.'Open Sans'
                  Size: =11
                  Height: =44
                  DelayOutput: =true
                  BorderColor: =clrBorder
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
            - galFaqs:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Items: =Filter(MS_FAQs, IsBlank(txtFaqSearch.Text) || txtFaqSearch.Text in Title || txtFaqSearch.Text in Answer)
                  TemplateSize: =124
                  TemplatePadding: =6
                  ShowScrollbar: =false
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
                  LayoutMinHeight: =200
                Children:
                  - rectFaq:
                      Control: Rectangle
                      Properties:
                        Fill: =clrSurface
                        BorderColor: =clrBorder
                        BorderThickness: =1
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                  - lblFaqQuestion:
                      Control: Label
                      Properties:
                        Text: =ThisItem.Title
                        Font: =Font.'Open Sans'
                        Size: =12
                        Color: =clrText
                        FontWeight: =FontWeight.Bold
                        X: =16
                        Y: =10
                        Width: =Parent.TemplateWidth - 32
                        Height: =26
                  - lblFaqAnswer:
                      Control: Label
                      Properties:
                        Text: =ThisItem.Answer
                        Font: =Font.'Open Sans'
                        Size: =10
                        Color: =clrMuted
                        FontWeight: =FontWeight.Normal
                        X: =16
                        Y: =38
                        Width: =Parent.TemplateWidth - 32
                        Height: =74
                        VerticalAlign: =VerticalAlign.Top
            - lblHelpContact:
                Control: Label
                Properties:
                  Text: ="Can't find your answer? Contact the HR / People team or any store admin."
                  Font: =Font.'Open Sans'
                  Size: =10
                  Color: =clrMuted
                  FontWeight: =FontWeight.Normal
                  Height: =30
      - conNavHelp:
          Control: GroupContainer
          Variant: horizontalAutoLayoutContainer
          Properties:
            LayoutMode: =LayoutMode.Auto
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            LayoutAlignItems: =LayoutAlignItems.Stretch
            DropShadow: =DropShadow.None
            Fill: =clrSurface
            Height: =56
            BorderColor: =clrBorder
            BorderThickness: =1
          Children:
            - btnNavShopHelp:
                Control: Button
                Properties:
                  Text: ="Shop"
                  OnSelect: =Navigate(scrShop, ScreenTransition.None)
                  Font: =Font.'Open Sans'
                  Size: =11
                  FontWeight: =If(App.ActiveScreen = scrShop, FontWeight.Bold, FontWeight.Semibold)
                  Fill: =If(App.ActiveScreen = scrShop, clrSoftGreen, clrSurface)
                  Color: =If(App.ActiveScreen = scrShop, clrDarkGreen, clrMuted)
                  HoverFill: =ColorFade(clrSurface, -10%)
                  PressedFill: =ColorFade(clrSurface, -20%)
                  HoverColor: =If(App.ActiveScreen = scrShop, clrDarkGreen, clrMuted)
                  BorderColor: =clrSurface
                  BorderThickness: =0
                  DisabledFill: =clrBg
                  DisabledColor: =clrMuted
                  DisabledBorderColor: =clrBorder
                  Height: =56
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  FillPortions: =1
