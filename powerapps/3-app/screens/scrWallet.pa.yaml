- conRootWallet:
    Control: GroupContainer
    Variant: verticalAutoLayoutContainer
    Properties:
      LayoutMode: =LayoutMode.Auto
      LayoutDirection: =LayoutDirection.Vertical
      LayoutGap: =0
      LayoutAlignItems: =LayoutAlignItems.Stretch
      DropShadow: =DropShadow.None
      Fill: =clrBg
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
    Children:
      - conHeaderWallet:
          Control: GroupContainer
          Variant: horizontalAutoLayoutContainer
          Properties:
            LayoutMode: =LayoutMode.Auto
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =8
            LayoutAlignItems: =LayoutAlignItems.Center
            DropShadow: =DropShadow.None
            Fill: =clrBlack
            Height: =64
            PaddingLeft: =16
            PaddingRight: =16
          Children:
            - lblBrandWallet:
                Control: Label
                Properties:
                  Text: ="Merch Store"
                  Font: =Font.'Open Sans'
                  Size: =15
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Width: =130
                  Height: =40
            - lblBrandDotWallet:
                Control: Label
                Properties:
                  Text: ="●"
                  Font: =Font.'Open Sans'
                  Size: =12
                  Color: =clrGreen
                  FontWeight: =FontWeight.Normal
                  Width: =20
                  Height: =40
            - lblHeaderSpacerWallet:
                Control: Label
                Properties:
                  Text: =""
                  Font: =Font.'Open Sans'
                  Size: =11
                  Color: =clrText
                  FontWeight: =FontWeight.Normal
                  FillPortions: =1
                  Height: =40
                  Width: =10
            - btnBalanceWallet:
                Control: Button
                Properties:
                  Text: =Text(fxBalance) & " tokens"
                  OnSelect: =Navigate(scrWallet, ScreenTransition.None)
                  Font: =Font.'Open Sans'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Fill: =clrGreen
                  Color: =clrBlack
                  HoverFill: =ColorFade(clrGreen, -10%)
                  PressedFill: =ColorFade(clrGreen, -20%)
                  HoverColor: =clrBlack
                  BorderColor: =clrGreen
                  BorderThickness: =1
                  DisabledFill: =clrBg
                  DisabledColor: =clrMuted
                  DisabledBorderColor: =clrBorder
                  Height: =36
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  Width: =130
            - btnCartWallet:
                Control: Button
                Properties:
                  Text: ="Cart (" & Sum(colCart, Qty) & ")"
                  OnSelect: =Navigate(scrCart, ScreenTransition.None)
                  Font: =Font.'Open Sans'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Fill: =clrBlack
                  Color: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(clrBlack, -10%)
                  PressedFill: =ColorFade(clrBlack, -20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  BorderColor: =RGBA(255, 255, 255, 0.4)
                  BorderThickness: =1
                  DisabledFill: =clrBg
                  DisabledColor: =clrMuted
                  DisabledBorderColor: =clrBorder
                  Height: =36
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  Width: =100
      - conBodyWallet:
          Control: GroupContainer
          Variant: verticalAutoLayoutContainer
          Properties:
            LayoutMode: =LayoutMode.Auto
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutAlignItems: =LayoutAlignItems.Stretch
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            FillPortions: =1
            PaddingTop: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
          Children:
            - lblWalletTitle:
                Control: Label
                Properties:
                  Text: ="My wallet"
                  Font: =Font.'Open Sans'
                  Size: =18
                  Color: =clrText
                  FontWeight: =FontWeight.Bold
                  Height: =36
            - conWalletSummary:
                Control: GroupContainer
                Variant: verticalAutoLayoutContainer
                Properties:
                  LayoutMode: =LayoutMode.Auto
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =2
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  DropShadow: =DropShadow.None
                  Fill: =clrBlack
                  Height: =110
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                Children:
                  - lblWalletEyebrow:
                      Control: Label
                      Properties:
                        Text: ="BALANCE"
                        Font: =Font.'Open Sans'
                        Size: =9
                        Color: =clrGreen
                        FontWeight: =FontWeight.Bold
                        Height: =20
                  - lblWalletAmount:
                      Control: Label
                      Properties:
                        Text: =fxBalance & " tokens"
                        Font: =Font.'Open Sans'
                        Size: =26
                        Color: =RGBA(255, 255, 255, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =48
            - galLedger:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Items: =Sort(Filter(MS_TokenLedger, StaffEmail = fxEmail), ID, SortOrder.Descending)
                  TemplateSize: =68
                  TemplatePadding: =6
                  ShowScrollbar: =false
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
                  LayoutMinHeight: =200
                Children:
                  - rectLedger:
                      Control: Rectangle
                      Properties:
                        Fill: =clrSurface
                        BorderColor: =clrBorder
                        BorderThickness: =1
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                  - lblLedgerReason:
                      Control: Label
                      Properties:
                        Text: =ThisItem.Title
                        Font: =Font.'Open Sans'
                        Size: =12
                        Color: =clrText
                        FontWeight: =FontWeight.Bold
                        X: =16
                        Y: =8
                        Width: =Parent.TemplateWidth - 140
                        Height: =26
                  - lblLedgerMeta:
                      Control: Label
                      Properties:
                        Text: =ThisItem.EntryType.Value & " · " & Text(ThisItem.Created, "d mmm yyyy") & If(IsBlank(ThisItem.AwardedBy), "", " · from " & ThisItem.AwardedBy)
                        Font: =Font.'Open Sans'
                        Size: =10
                        Color: =clrMuted
                        FontWeight: =FontWeight.Normal
                        X: =16
                        Y: =34
                        Width: =Parent.TemplateWidth - 140
                        Height: =22
                  - lblLedgerAmount:
                      Control: Label
                      Properties:
                        Text: =If(ThisItem.Amount > 0, "+", "") & ThisItem.Amount
                        Font: =Font.'Open Sans'
                        Size: =15
                        Color: =If(ThisItem.Amount > 0, clrDarkGreen, clrDanger)
                        FontWeight: =FontWeight.Bold
                        Align: =Align.Right
                        X: =Parent.TemplateWidth - 120
                        Y: =14
                        Width: =104
                        Height: =36
      - conNavWallet:
          Control: GroupContainer
          Variant: horizontalAutoLayoutContainer
          Properties:
            LayoutMode: =LayoutMode.Auto
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            LayoutAlignItems: =LayoutAlignItems.Stretch
            DropShadow: =DropShadow.None
            Fill: =clrSurface
            Height: =56
            BorderColor: =clrBorder
            BorderThickness: =1
          Children:
            - btnNavShopWallet:
                Control: Button
                Properties:
                  Text: ="Shop"
                  OnSelect: =Navigate(scrShop, ScreenTransition.None)
                  Font: =Font.'Open Sans'
                  Size: =11
                  FontWeight: =If(App.ActiveScreen = scrShop, FontWeight.Bold, FontWeight.Semibold)
                  Fill: =If(App.ActiveScreen = scrShop, clrSoftGreen, clrSurface)
                  Color: =If(App.ActiveScreen = scrShop, clrDarkGreen, clrMuted)
                  HoverFill: =ColorFade(clrSurface, -10%)
                  PressedFill: =ColorFade(clrSurface, -20%)
                  HoverColor: =If(App.ActiveScreen = scrShop, clrDarkGreen, clrMuted)
                  BorderColor: =clrSurface
                  BorderThickness: =0
                  DisabledFill: =clrBg
                  DisabledColor: =clrMuted
                  DisabledBorderColor: =clrBorder
                  Height: =56
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  FillPortions: =1
            - btnNavOrdersWallet:
                Control: Button
                Properties:
                  Text: ="My orders"
                  OnSelect: =Navigate(scrOrders, ScreenTransition.None)
                  Font: =Font.'Open Sans'
                  Size: =11
                  FontWeight: =If(App.ActiveScreen = scrOrders, FontWeight.Bold, FontWeight.Semibold)
                  Fill: =If(App.ActiveScreen = scrOrders, clrSoftGreen, clrSurface)
                  Color: =If(App.ActiveScreen = scrOrders, clrDarkGreen, clrMuted)
                  HoverFill: =ColorFade(clrSurface, -10%)
                  PressedFill: =ColorFade(clrSurface, -20%)
                  HoverColor: =If(App.ActiveScreen = scrOrders, clrDarkGreen, clrMuted)
                  BorderColor: =clrSurface
                  BorderThickness: =0
                  DisabledFill: =clrBg
                  DisabledColor: =clrMuted
                  DisabledBorderColor: =clrBorder
                  Height: =56
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  FillPortions: =1
            - btnNavWalletWallet:
                Control: Button
                Properties:
                  Text: ="Wallet"
                  OnSelect: =Navigate(scrWallet, ScreenTransition.None)
                  Font: =Font.'Open Sans'
                  Size: =11
                  FontWeight: =If(App.ActiveScreen = scrWallet, FontWeight.Bold, FontWeight.Semibold)
                  Fill: =If(App.ActiveScreen = scrWallet, clrSoftGreen, clrSurface)
                  Color: =If(App.ActiveScreen = scrWallet, clrDarkGreen, clrMuted)
                  HoverFill: =ColorFade(clrSurface, -10%)
