- conRootOrders:
    Control: GroupContainer
    Variant: verticalAutoLayoutContainer
    Properties:
      LayoutMode: =LayoutMode.Auto
      LayoutDirection: =LayoutDirection.Vertical
      LayoutGap: =0
      LayoutAlignItems: =LayoutAlignItems.Stretch
      DropShadow: =DropShadow.None
      Fill: =clrBg
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
    Children:
      - conHeaderOrders:
          Control: GroupContainer
          Variant: horizontalAutoLayoutContainer
          Properties:
            LayoutMode: =LayoutMode.Auto
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =8
            LayoutAlignItems: =LayoutAlignItems.Center
            DropShadow: =DropShadow.None
            Fill: =clrBlack
            Height: =64
            PaddingLeft: =16
            PaddingRight: =16
          Children:
            - lblBrandOrders:
                Control: Label
                Properties:
                  Text: ="Merch Store"
                  Font: =Font.'Open Sans'
                  Size: =15
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Width: =130
                  Height: =40
            - lblBrandDotOrders:
                Control: Label
                Properties:
                  Text: ="●"
                  Font: =Font.'Open Sans'
                  Size: =12
                  Color: =clrGreen
                  FontWeight: =FontWeight.Normal
                  Width: =20
                  Height: =40
            - lblHeaderSpacerOrders:
                Control: Label
                Properties:
                  Text: =""
                  Font: =Font.'Open Sans'
                  Size: =11
                  Color: =clrText
                  FontWeight: =FontWeight.Normal
                  FillPortions: =1
                  Height: =40
                  Width: =10
            - btnBalanceOrders:
                Control: Button
                Properties:
                  Text: =Text(fxBalance) & " tokens"
                  OnSelect: =Navigate(scrWallet, ScreenTransition.None)
                  Font: =Font.'Open Sans'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Fill: =clrGreen
                  Color: =clrBlack
                  HoverFill: =ColorFade(clrGreen, -10%)
                  PressedFill: =ColorFade(clrGreen, -20%)
                  HoverColor: =clrBlack
                  BorderColor: =clrGreen
                  BorderThickness: =1
                  DisabledFill: =clrBg
                  DisabledColor: =clrMuted
                  DisabledBorderColor: =clrBorder
                  Height: =36
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  Width: =130
            - btnCartOrders:
                Control: Button
                Properties:
                  Text: ="Cart (" & Sum(colCart, Qty) & ")"
                  OnSelect: =Navigate(scrCart, ScreenTransition.None)
                  Font: =Font.'Open Sans'
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  Fill: =clrBlack
                  Color: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(clrBlack, -10%)
                  PressedFill: =ColorFade(clrBlack, -20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  BorderColor: =RGBA(255, 255, 255, 0.4)
                  BorderThickness: =1
                  DisabledFill: =clrBg
                  DisabledColor: =clrMuted
                  DisabledBorderColor: =clrBorder
                  Height: =36
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  Width: =100
      - conBodyOrders:
          Control: GroupContainer
          Variant: verticalAutoLayoutContainer
          Properties:
            LayoutMode: =LayoutMode.Auto
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutAlignItems: =LayoutAlignItems.Stretch
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            FillPortions: =1
            PaddingTop: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
          Children:
            - lblOrdersTitle:
                Control: Label
                Properties:
                  Text: ="My orders"
                  Font: =Font.'Open Sans'
                  Size: =18
                  Color: =clrText
                  FontWeight: =FontWeight.Bold
                  Height: =36
            - lblOrdersEmpty:
                Control: Label
                Properties:
                  Text: ="No orders yet. Visit the Shop to pick something."
                  Font: =Font.'Open Sans'
                  Size: =11
                  Color: =clrMuted
                  FontWeight: =FontWeight.Normal
                  Height: =30
                  Visible: =CountRows(galOrders.AllItems) = 0
            - galOrders:
                Control: Gallery
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Items: =Sort(Filter(MS_Orders, StaffEmail = fxEmail), ID, SortOrder.Descending)
                  TemplateSize: =272
                  TemplatePadding: =6
                  ShowScrollbar: =false
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
                  LayoutMinHeight: =300
                Children:
                  - rectOrder:
                      Control: Rectangle
                      Properties:
                        Fill: =clrSurface
                        BorderColor: =clrBorder
                        BorderThickness: =1
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                  - lblOrderNumber:
                      Control: Label
                      Properties:
                        Text: =ThisItem.Title
                        Font: =Font.'Open Sans'
                        Size: =13
                        Color: =clrText
                        FontWeight: =FontWeight.Bold
                        X: =16
                        Y: =12
                        Width: =Parent.TemplateWidth - 160
                        Height: =26
                  - lblOrderMeta:
                      Control: Label
                      Properties:
                        Text: =Text(ThisItem.Created, "d mmm yyyy") & " · " & ThisItem.Total & " tokens"
                        Font: =Font.'Open Sans'
                        Size: =10
                        Color: =clrMuted
                        FontWeight: =FontWeight.Normal
                        X: =16
                        Y: =38
                        Width: =Parent.TemplateWidth - 160
                        Height: =22
                  - lblOrderStatus:
                      Control: Label
                      Properties:
                        Text: =ThisItem.Status.Value
                        Font: =Font.'Open Sans'
                        Size: =10
                        Color: =Switch(ThisItem.Status.Value, "Processing", clrBlue, "Ready", clrDarkGreen, "Cancelled", clrDanger, clrMuted)
                        FontWeight: =FontWeight.Bold
                        Fill: =Switch(ThisItem.Status.Value, "Processing", clrBlueSoft, "Ready", clrSoftGreen, "Cancelled", clrDangerSoft, clrBg)
                        Align: =Align.Center
                        X: =Parent.TemplateWidth - 132
                        Y: =14
                        Width: =116
                        Height: =28
                  - lblOrderItems:
                      Control: Label
                      Properties:
                        Text: =ThisItem.ItemsSummary
                        Font: =Font.'Open Sans'
                        Size: =11
                        Color: =clrText
                        FontWeight: =FontWeight.Normal
                        X: =16
                        Y: =64
                        Width: =Parent.TemplateWidth - 32
                        Height: =24
                  - imgOrderQr:
                      Control: Image
                      Properties:
                        Image: =fxQrBase & EncodeUrl(fxAppLink & If(Find("?", fxAppLink) > 0, "&", "?") & "code=" & ThisItem.PickupCode)
                        Visible: =ThisItem.Status.Value in ["Pending", "Processing", "Ready"] && !IsBlank(ThisItem.PickupCode)
                        ImagePosition: =ImagePosition.Fit
                        Fill: =RGBA(255, 255, 255, 1)
                        BorderColor: =clrBlack
                        BorderThickness: =2
                        X: =16
                        Y: =96
                        Width: =140
                        Height: =140
                  - lblOrderShowThis:
                      Control: Label
                      Properties:
                        Text: ="Show this at the collection desk"
                        Font: =Font.'Open Sans'
                        Size: =11
                        Color: =clrText
                        FontWeight: =FontWeight.Bold
                        Visible: =ThisItem.Status.Value in ["Pending", "Processing", "Ready"]
                        X: =172
                        Y: =100
                        Width: =Parent.TemplateWidth - 188
                        Height: =24
                  - lblOrderCode:
                      Control: Label
                      Properties:
                        Text: =Left(ThisItem.PickupCode, 4) & "-" & Right(ThisItem.PickupCode, 4)
                        Font: =Font.'Courier New'
                        Size: =20
                        Color: =clrText
                        FontWeight: =FontWeight.Bold
                        Visible: =ThisItem.Status.Value in ["Pending", "Processing", "Ready"]
                        X: =172
                        Y: =124
                        Width: =Parent.TemplateWidth - 188
                        Height: =36
                  - lblOrderCollect:
                      Control: Label
                      Properties:
                        Text: =If(IsBlank(ThisItem.CollectionDate), "Collection date to be confirmed. We'll email you.", "Collect on " & Text(ThisItem.CollectionDate, "dddd, d mmmm yyyy") & Char(10) & ThisItem.CollectionLocation)
                        Font: =Font.'Open Sans'
                        Size: =10
                        Color: =RGBA(255, 255, 255, 1)
                        FontWeight: =FontWeight.Normal
                        Fill: =clrBlack
                        Visible: =ThisItem.Status.Value in ["Pending", "Processing", "Ready"]
                        PaddingLeft: =10
                        X: =172
                        Y: =166
                        Width: =Parent.TemplateWidth - 188
                        Height: =48
                  - btnOrderCancel:
                      Control: Button
                      Properties:
                        Text: =If(varConfirmCancel = ThisItem.ID, "Tap again to cancel", "Cancel & refund")
                        OnSelect: |-
                          =If(varConfirmCancel = ThisItem.ID,
                              Set(varResult, MSCancelOrder.Run(ThisItem.ID));
                              Set(varConfirmCancel, Blank());
                              If(varResult.ok = "yes",
                                  Refresh(MS_Orders); Refresh(MS_TokenLedger); Refresh(MS_Products);
                                  Notify(varResult.message, NotificationType.Success),
                                  Notify(varResult.message, NotificationType.Error)
                              ),
                              Set(varConfirmCancel, ThisItem.ID)
                          )
                        Font: =Font.'Open Sans'
                        Size: =11
                        FontWeight: =FontWeight.Semibold
                        Fill: =clrSurface
                        Color: =clrDanger
                        HoverFill: =ColorFade(clrSurface, -10%)
                        PressedFill: =ColorFade(clrSurface, -20%)
                        HoverColor: =clrDanger
                        BorderColor: =clrDanger
                        BorderThickness: =1
                        DisabledFill: =clrBg
                        DisabledColor: =clrMuted
                        DisabledBorderColor: =clrBorder
                        Height: =36
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        Visible: =ThisItem.Status.Value = "Pending"
                        X: =172
                        Y: =222
                        Width: =180
