                        BorderColor: =clrDarkGreen
                        BorderThickness: =1
                        DisabledFill: =clrBg
                        DisabledColor: =clrMuted
                        DisabledBorderColor: =clrBorder
                        Height: =48
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        DisplayMode: =If(Value(txtAwardAmount.Text) > 0 && !IsBlank(Trim(txtAwardReason.Text)) && CountRows(cmbPeople.SelectedItems) > 0, DisplayMode.Edit, DisplayMode.Disabled)
