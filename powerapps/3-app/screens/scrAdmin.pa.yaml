            - conAdminAwardTab:
                Control: GroupContainer
                Variant: verticalAutoLayoutContainer
                Properties:
                  LayoutMode: =LayoutMode.Auto
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 0, 0, 0)
                  Visible: =varAdminTab = "Award"
                  FillPortions: =1
                Children:
                  - lblAwardHelp:
                      Control: Label
                      Properties:
                        Text: ="Recognise staff with appreciation tokens. Pick people in the box below (Combo box cmbPeople), then enter the amount and reason. Each person gets an email."
                        Font: =Font.'Open Sans'
                        Size: =11
                        Color: =clrMuted
                        FontWeight: =FontWeight.Normal
                        Height: =48
                  - txtAwardAmount:
                      Control: TextInput
                      Properties:
                        Default: =""
                        HintText: ="Tokens, e.g. 50"
                        Format: =TextFormat.Number
                        Font: =Font.'Open Sans'
                        Size: =12
                        Height: =44
                        BorderColor: =clrBorder
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                  - txtAwardReason:
                      Control: TextInput
                      Properties:
                        Default: =""
                        HintText: ="Reason, e.g. Great job on the client launch"
                        Font: =Font.'Open Sans'
                        Size: =12
                        Height: =44
                        BorderColor: =clrBorder
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                  - btnAward:
                      Control: Button
                      Properties:
                        Text: ="Award tokens"
                        OnSelect: |-
                          =Set(varResult, MSAwardTokens.Run(
                              "[" & Concat(cmbPeople.SelectedItems, Char(34) & Lower(Mail) & Char(34), ",") & "]",
                              Value(txtAwardAmount.Text),
                              txtAwardReason.Text
                          ));
                          Notify(varResult.message, If(varResult.ok = "yes", NotificationType.Success, NotificationType.Error));
                          If(varResult.ok = "yes", Reset(cmbPeople); Reset(txtAwardAmount); Reset(txtAwardReason))
                        Font: =Font.'Open Sans'
                        Size: =11
                        FontWeight: =FontWeight.Semibold
                        Fill: =clrDarkGreen
                        Color: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(clrDarkGreen, -10%)
